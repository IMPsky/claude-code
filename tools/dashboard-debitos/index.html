[hidden]{display:none!important}

/* ===== Header ===== */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:10px 12px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:10px 14px;box-shadow:var(--shadow)}
.brand{display:flex;align-items:center;gap:12px;margin-right:auto;min-width:0;flex-wrap:wrap}

.upd{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;padding:4px 10px;border-radius:999px;background:var(--surface-2);border:1px solid var(--border);color:var(--muted);min-width:0}

.search{position:relative;min-width:180px;flex:1 1 200px;max-width:300px}
.search input{width:100%;padding:8px 10px 8px 32px;border:1px solid var(--border);border-radius:8px;background:var(--surface-2)}

.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:8px;border:1px solid var(--border);background:var(--surface);cursor:pointer;white-space:nowrap;font-weight:600}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

@media (max-width:1560px) and (min-width:721px){.who .nm{display:none}}
/* ===== Panels / filtros ===== */
.panel{background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);margin-top:12px;min-width:0}
.panel-h{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.panel-h h2{font-family:var(--f-display);font-size:17px;margin:0;font-weight:700}
.panel-h .sp{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.filters{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px 10px;padding:12px 14px}
.filters.collapsed{display:none}
.f{min-width:0}
.f label{display:block;font-size:11px;color:var(--muted);margin-bottom:3px;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.f .dd{width:100%;text-align:left;padding:6px 26px 6px 9px;border:1px solid var(--border);border-radius:7px;background:var(--surface-2);cursor:pointer;position:relative;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:400}

.chips{display:flex;flex-wrap:wrap;gap:6px;padding:0 14px 10px}
.chips:empty{display:none}
.chip{background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:3px 6px 3px 10px;font-size:12px;display:inline-flex;gap:6px;align-items:center;max-width:100%}
.chip button{border:0;background:transparent;cursor:pointer;color:inherit;font-weight:700;padding:0 4px}

.pop{position:fixed;z-index:100;background:var(--surface);border:1px solid var(--border);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.2);width:290px;max-width:calc(100vw - 16px);display:none;flex-direction:column;max-height:380px}
.pop.open{display:flex}
.pop .ph{padding:8px;border-bottom:1px solid var(--border)}
.pop .ph input{width:100%;padding:6px 8px;border:1px solid var(--border);border-radius:6px;background:var(--surface-2)}
.pop .pa{display:flex;gap:6px;padding:6px 8px;border-bottom:1px solid var(--border)}
.pop ul{list-style:none;margin:0;padding:4px 0;overflow:auto;flex:1}
.pop li label{display:flex;align-items:center;gap:8px;padding:5px 10px;cursor:pointer}
.pop li label:hover{background:var(--surface-2)}
.pop li .v{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pop li .n{color:var(--muted);font-size:11.5px;font-variant-numeric:tabular-nums}

/* ===== KPIs ===== */
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;margin-top:12px}
@media (min-width:1300px){.kpis{grid-template-columns:repeat(5,1fr)}}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 14px;box-shadow:var(--shadow);display:flex;flex-direction:column;min-height:150px;min-width:0;position:relative;overflow:hidden}
.kpi::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--kc,var(--accent))}
.kpi.wide{grid-column:span 2}
@media (max-width:560px){.kpi.wide{grid-column:auto}}
.kpi .kt{font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;display:flex;justify-content:space-between;gap:8px}
.kpi .kv{font-family:var(--f-display);font-size:32px;font-weight:700;margin:2px 0 0;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi .ks{font-size:12px;color:var(--muted);margin-bottom:6px}
.kpi.hero .kv{font-size:46px}
.kpi .kv.money{font-size:clamp(20px,1.9vw,27px);overflow-wrap:anywhere;line-height:1.15}
.brk{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:3px;overflow:auto;max-height:122px}
.brk li{display:grid;grid-template-columns:1fr auto;gap:2px 8px;cursor:pointer;border-radius:6px;padding:2px 4px}
.brk li:hover{background:var(--surface-2)}
.brk li.sel{background:var(--accent-soft)}
.brk .bl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12.5px}
.brk .bn{font-weight:700;font-size:12.5px;font-variant-numeric:tabular-nums}
.brk .bar{grid-column:1/3;height:4px;background:var(--surface-2);border-radius:3px;overflow:hidden}
.brk .bar i{display:block;height:100%;background:var(--kc,var(--accent));border-radius:3px}
.mini{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:6px 12px;font-size:12px;color:var(--muted)}
.mini b{display:block;font-size:14px;color:var(--text);font-variant-numeric:tabular-nums}

/* ===== Charts ===== */
.charts{display:grid;grid-template-columns:2fr 1fr 1fr;gap:12px;margin-top:12px}
.chart-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 14px;box-shadow:var(--shadow);min-width:0}
.chart-card .ch{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.chart-card h3{font-family:var(--f-display);margin:0;font-size:16px;font-weight:700}
.chart-card .ch select{margin-left:auto;padding:4px 6px;border:1px solid var(--border);border-radius:6px;background:var(--surface-2);font-size:12.5px;max-width:100%}
.cbox{position:relative;height:290px}
.empty-c{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);text-align:center;padding:10px}
@media (max-width:1200px){.charts{grid-template-columns:1fr 1fr}.charts .bar-card{grid-column:1/3}}
@media (max-width:720px){.charts{grid-template-columns:1fr}.charts .bar-card{grid-column:auto}.search{flex:1 1 100%;max-width:none}.who{border-left:0;padding-left:0}}

/* ===== Table ===== */
.tbl-wrap{overflow:auto;max-height:620px}
table.rep{border-collapse:separate;border-spacing:0;width:max-content;min-width:100%;font-size:12.5px}
table.rep th,table.rep td{padding:6px 9px;border-bottom:1px solid var(--border);white-space:nowrap;text-align:left}
table.rep th{position:sticky;top:0;background:var(--surface-2);font-weight:700;font-size:11.5px;cursor:pointer;user-select:none;z-index:1;text-transform:uppercase;letter-spacing:.03em;color:var(--muted)}
table.rep th:hover{color:var(--accent)}
table.rep th .s{opacity:.5;margin-left:3px}

table.rep td.desc{max-width:280px;overflow:hidden;text-overflow:ellipsis}
table.rep tbody tr:hover td{background:var(--accent-soft)}
table.rep tfoot td{position:sticky;bottom:0;background:var(--surface-2);font-weight:700;border-top:2px solid var(--border)}
.tag{display:inline-block;padding:1px 8px;border-radius:999px;font-size:11.5px;font-weight:600;background:var(--surface-2);color:var(--text)}
.tag.t-aberto{background:var(--t-aberto-bg);color:var(--t-aberto-fg)}
.tag.t-parcial{background:var(--t-parcial-bg);color:var(--t-parcial-fg)}

.pager{display:flex;align-items:center;gap:8px;padding:8px 14px;flex-wrap:wrap;border-top:1px solid var(--border)}
.pager select{padding:4px 6px;border:1px solid var(--border);border-radius:6px;background:var(--surface-2)}

/* ===== Estados ===== */
.empty{margin-top:12px;background:var(--surface);border:2px dashed var(--border);border-radius:14px;padding:48px 20px;text-align:center;color:var(--muted)}
.empty.over{border-color:var(--accent);background:var(--accent-soft)}
.empty h2{font-family:var(--f-display);color:var(--text);margin:8px 0 4px;font-size:22px}
.loading{margin-top:12px;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:40px 20px;text-align:center;color:var(--muted)}
.modal-bg{position:fixed;inset:0;z-index:120;background:rgba(8,12,20,.55);display:grid;place-items:center;padding:16px}

.toast.show{opacity:1}
/* ===== Seletor de tema ===== */
.tmenu{position:fixed;z-index:110;background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:12px;box-shadow:0 12px 32px rgba(0,0,0,.25);padding:6px;width:230px;max-width:calc(100vw - 16px)}
.tmenu button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;padding:8px 10px;border-radius:8px;cursor:pointer;text-align:left;color:var(--text)}

.tmenu .sw i{width:12px;height:18px;display:block}
.tmenu .tl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;padding:6px 10px 4px;font-weight:700}
/* ===== Local de Tratativa ===== */
select.trat{appearance:none;-webkit-appearance:none;border:1px solid transparent;border-radius:999px;padding:2px 24px 2px 10px;font-size:12px;font-weight:600;cursor:pointer;
  background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);background-position:calc(100% - 12px) 55%,calc(100% - 8px) 55%;background-size:4px 4px;background-repeat:no-repeat}

select.trat.pend{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.savebar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:90;display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center;
  background:var(--surface);color:var(--text);border:1px solid var(--accent);border-radius:12px;box-shadow:0 12px 32px rgba(0,0,0,.25);padding:10px 12px 10px 16px;max-width:calc(100vw - 32px)}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

<script id="dd-main">
(() => {
'use strict';

/* ===================== Página que guarda os próprios dados ===================== */
const SHELL = document.getElementById('dd-shell');
document.body.appendChild(SHELL.content.cloneNode(true));
let DATA = {};
try { DATA = JSON.parse(document.getElementById('dd-data').textContent || '{}') || {}; } catch (_) { DATA = {}; }
const SKEL = '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>\n';
const HEAD_TAGS = "<title>Dashboard de Débitos<\/title>\n<meta name=\"claude:viewport-fit-sides\" content=\"cover\">\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Source+Sans+3:wght@400;600;700&display=swap\">\n<script src=\"https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js\"><\/script>\n<script src=\"https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js\"><\/script>\n<script src=\"https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js\"><\/script>\n<script src=\"https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js\"><\/script>";
function buildDoc(data){
  const json = JSON.stringify(data).replace(/</g, '\\u003c');
  return SKEL + HEAD_TAGS + '\n<style id="dd-style">' + document.getElementById('dd-style').textContent + '</style>\n'
    + '<template id="dd-shell">' + SHELL.innerHTML + '</template>\n'
    + '<script type="application/json" id="dd-data">' + json + '<' + '/script>\n'
    + '<script id="dd-main">' + document.getElementById('dd-main').textContent + '<' + '/script>\n</body></html>';
}
const READONLY = new Set(['not_writer','not_granted','capability_disabled','capability_removed','not_declared','consent_required']);

/* ===================== Configuração ===================== */
const REPORT_COLS = ['Filial','Processo','Status Processo','Status NF','DT Ocorrência','Subcontratada','Seguradora','Seguro Via',
  'Tipo Processo','Motivo','Tipo Operação','Setor','Local de Tratativa','Transportador','Placa','NF Origem','Item','Descrição','Qtd',
  'Valor Unitario','Valor Desconto','Valor Frete','Valor Total','DT Lançamento','Usuario Lançamento'];
const TRAT = 'Local de Tratativa';
const TRAT_OPTS = ['Retorno','Controle','Distribuição','Transportadora'];
const ALL_COLS = [...REPORT_COLS.filter(c => c !== TRAT), 'Valor Debito'];
const NUM_COLS = new Set(['Qtd','Valor Unitario','Valor Desconto','Valor Frete','Valor Total','Valor Debito']);
const MONEY_COLS = new Set(['Valor Unitario','Valor Desconto','Valor Frete','Valor Total','Valor Debito']);
const DATE_COLS = new Set(['DT Ocorrência','DT Lançamento']);
const KPI_DIMS = [['Status Processo','var(--c2)'],['Status NF','var(--c3)'],['Tipo Processo','var(--c5)'],['Motivo','var(--c4)'],
  ['Tipo Operação','var(--c6)'],['Setor','var(--c7)'],[TRAT,'var(--c1)'],['Transportador','var(--c8)']];
const GROUP_OPTS = ['Transportador','Status Processo','Status NF','Tipo Processo','Motivo','Tipo Operação','Setor',TRAT,'DT Lançamento','Usuario Lançamento'];
const PALETTE = ['#1f5fd1','#0e9c9a','#e09310','#d6456f','#7357e8','#5c9a2e','#e0662e','#46607f','#14a3d6','#b04fc2','#8d98aa'];
const CHUNK_CHARS = 150000;

/* ===================== Estado ===================== */
let ROWS = [], META = null, FILTERED = [];
const filters = {};
let dateFrom = '', dateTo = '', query = '', sort = {col:'Processo', dir:1}, page = 0;
const charts = {};
let me = null;              // {key, name}
let S = null;               // camada de armazenamento (nuvem ou local)
let dl = null;              // capability downloads

/* ===================== Utilidades ===================== */
const $ = s => document.querySelector(s);
const norm = s => String(s ?? '').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/\s+/g,' ').trim();
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtInt = n => n.toLocaleString('pt-BR');
const fmtMoney = n => (n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const fmtNum = n => (n||0).toLocaleString('pt-BR',{maximumFractionDigits:2});
const pad = n => String(n).padStart(2,'0');
const fmtStamp = iso => { const d = new Date(iso); return `${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()} às ${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const lsGet = k => { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch(_) { return null; } };
const lsSet = (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, JSON.stringify(v)); } catch(_){} };
function toast(msg, ms = 3200){ const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), ms); }
const nameKey = n => norm(n).replace(/[^a-z0-9 ]/g,'').trim().replace(/ /g,'-').slice(0,120);
const initials = n => n.trim().split(/\s+/).filter(Boolean).map(w => w[0]).filter((_,i,a) => i === 0 || i === a.length-1).join('').toUpperCase();

function parseNum(v){ if (typeof v === 'number') return v; if (v == null || v === '') return 0;
  let s = String(v).replace(/[R$\s]/g,''); if (s.includes(',')) s = s.replace(/\./g,'').replace(',', '.'); const n = parseFloat(s); return isNaN(n) ? 0 : n; }
function fmtDate(v){
  if (v == null || v === '') return '';
  if (v instanceof Date && !isNaN(v)) return `${pad(v.getDate())}/${pad(v.getMonth()+1)}/${v.getFullYear()}`;
  if (typeof v === 'number') { const d = XLSX.SSF.parse_date_code(v); if (d) return `${pad(d.d)}/${pad(d.m)}/${d.y}`; }
  const s = String(v).trim();
  let m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})/); if (m) return `${pad(m[1])}/${pad(m[2])}/${m[3].length===2?'20'+m[3]:m[3]}`;
  m = s.match(/^(\d{4})-(\d{2})-(\d{2})/); if (m) return `${m[3]}/${m[2]}/${m[1]}`;
  return s;
}
const dateKey = s => { const m = String(s).match(/^(\d{2})\/(\d{2})\/(\d{4})$/); return m ? `${m[3]}-${m[2]}-${m[1]}` : ''; };
/* Dias corridos entre a data (dd/mm/aaaa) e hoje */
const daysSince = s => { const m = String(s).match(/^(\d{2})\/(\d{2})\/(\d{4})$/); if (!m) return null;
  const t = new Date(); return Math.round((Date.UTC(t.getFullYear(), t.getMonth(), t.getDate()) - Date.UTC(+m[3], +m[2]-1, +m[1])) / 86400000); };
const daysTxt = d => d == null ? '' : d === 1 ? '1 dia' : `${fmtInt(d)} dias`;
const cell = v => (v == null ? '' : String(v).trim());
const display = (col, v) => v === '' ? '(vazio)' : (MONEY_COLS.has(col) ? fmtMoney(+v) : NUM_COLS.has(col) ? fmtNum(+v) : String(v));

/* ===================== Senhas (PBKDF2) ===================== */
const b64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));
async function hashPass(pass, saltB64){
  const salt = saltB64 ? Uint8Array.from(atob(saltB64), c => c.charCodeAt(0)) : crypto.getRandomValues(new Uint8Array(16));
  const key = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveBits']);
  const bits = await crypto.subtle.deriveBits({name:'PBKDF2', hash:'SHA-256', salt, iterations:150000}, key, 256);
  return {salt: b64(salt), hash: b64(bits)};
}

/* ===================== Armazenamento ===================== */
function pageStore(art){
  const accts = () => Object.assign({}, lsGet('dd_accounts') || {}, DATA.accounts || {});
  const publishData = async data => { if (!art) throw {code:'not_granted'}; await art.publish(buildDoc(data)); };
  return {
    mode: art ? 'page' : 'readonly',
    async getAccount(key){ return accts()[key] || null; },
    async createAccount(key, acc){
      if (accts()[key]) return false;
      if (art) {
        lsSet('dd_session', {key, name: acc.name});
        try { await publishData(Object.assign({}, DATA, {accounts: Object.assign({}, DATA.accounts || {}, {[key]: acc})})); return true; }
        catch (e) { if (!(e && READONLY.has(e.code))) { lsSet('dd_session', null); throw e; } }
      }
      const l = lsGet('dd_accounts') || {}; l[key] = acc; lsSet('dd_accounts', l); return 'local';
    },
    watchMeta(fn){ TRATS = DATA.trat || {}; setTimeout(() => fn(DATA.meta || null, {fromCache:false}), 0); return () => {}; },
    async loadRows(){ return DATA.rows || []; },
    async saveTrat(trat){ await publishData(Object.assign({}, DATA, {trat})); },
    async saveBase(meta, rowsArr){
      meta.chunks = 1;
      meta.history = [{at: meta.updatedAt, by: meta.updatedBy, file: meta.fileName, rows: meta.rows, procs: meta.procs}, ...((DATA.meta && DATA.meta.history) || [])].slice(0, 20);
      stashView();
      const trat = Object.assign({}, DATA.trat || {}); const at = new Date().toISOString();
      for (const p in PENDING) trat[p] = {v: PENDING[p], by: me ? me.name : '', at};
      await publishData(Object.assign({}, DATA, {meta, rows: rowsArr, trat}));
    }
  };
}
function localStore(){
  const accts = () => lsGet('dd_accounts') || {};
  let watcher = null;
  return {
    mode:'local',
    async getAccount(key){ return accts()[key] || null; },
    async createAccount(key, acc){ const a = accts(); if (a[key]) return false; a[key] = acc; lsSet('dd_accounts', a); return true; },
    async saveTrat(trat){ lsSet('dd_trat', trat); },
    watchMeta(fn){ watcher = fn; TRATS = lsGet('dd_trat') || {}; const b = lsGet('dd_base'); setTimeout(() => fn(b ? b.meta : null, {fromCache:false}), 0); return () => {}; },
    async loadRows(){ const b = lsGet('dd_base'); return b ? b.rows : []; },
    async saveBase(meta, rowsArr){
      const old = lsGet('dd_base');
      meta.chunks = 1;
      meta.history = [{at: meta.updatedAt, by: meta.updatedBy, file: meta.fileName, rows: meta.rows, procs: meta.procs}, ...((old && old.meta.history) || [])].slice(0, 20);
      lsSet('dd_base', {meta, rows: rowsArr});
      if (!lsGet('dd_base')) throw new Error('O navegador não tem espaço para guardar esta base.');
      watcher && watcher(meta, {fromCache:false});
    }
  };
}

/* ===================== Acesso (login / criar conta) ===================== */
let signup = false;
function setTab(isSignup){
  signup = isSignup;
  $('#tabLogin').setAttribute('aria-selected', String(!isSignup));
  $('#tabSignup').setAttribute('aria-selected', String(isSignup));
  $('#fldPass2').hidden = !isSignup;
  $('#lTitle').textContent = isSignup ? 'Criar conta' : 'Entrar';
  $('#lSub').textContent = isSignup ? 'Só precisa do seu nome completo e de uma senha.' : 'Use seu nome completo e a senha cadastrada.';
  $('#lSubmit').textContent = isSignup ? 'Criar conta e entrar' : 'Entrar';
  $('#lPass').autocomplete = isSignup ? 'new-password' : 'current-password';
  $('#lErr').textContent = '';
}
$('#tabLogin').onclick = () => setTab(false);
$('#tabSignup').onclick = () => setTab(true);
$('#loginForm').addEventListener('submit', async e => {
  e.preventDefault();
  const name = $('#lName').value.trim().replace(/\s+/g,' '), pass = $('#lPass').value, err = $('#lErr'), btn = $('#lSubmit');
  err.textContent = '';
  if (name.split(' ').length < 2) { err.textContent = 'Digite seu nome completo (nome e sobrenome).'; return; }
  if (pass.length < 4) { err.textContent = 'A senha precisa ter pelo menos 4 caracteres.'; return; }
  const key = nameKey(name);
  if (!key) { err.textContent = 'Use letras no nome.'; return; }
  btn.disabled = true; const label = btn.textContent; btn.textContent = 'Aguarde…';
  try {
    if (signup) {
      if (pass !== $('#lPass2').value) { err.textContent = 'As senhas não conferem.'; return; }
      if (await S.getAccount(key)) { err.textContent = 'Já existe uma conta com esse nome. Use a aba Entrar.'; return; }
      const h = await hashPass(pass);
      const ok = await S.createAccount(key, {name, salt: h.salt, hash: h.hash, createdAt: new Date().toISOString()});
      if (!ok) { err.textContent = 'Já existe uma conta com esse nome. Use a aba Entrar.'; return; }
      startSession({key, name});
      toast(ok === 'local' ? `Conta criada neste navegador. Bem-vindo(a), ${name.split(' ')[0]}!` : `Conta criada. Bem-vindo(a), ${name.split(' ')[0]}!`, 4500);
    } else {
      const acc = await S.getAccount(key);
      if (!acc) { err.textContent = 'Nenhuma conta com esse nome. Confira o nome ou crie uma conta.'; return; }
      const h = await hashPass(pass, acc.salt);
      if (h.hash !== acc.hash) { err.textContent = 'Senha incorreta.'; return; }
      startSession({key, name: acc.name});
    }
  } catch (ex) {
    console.error(ex);
    err.textContent = ex && ex.code === 'conflict' ? 'Outra pessoa salvou ao mesmo tempo. A página vai recarregar; tente de novo em seguida.'
      : ex && ex.code === 'rate_limited' ? 'Muitas alterações seguidas. Aguarde um minuto e tente de novo.'
      : 'Não foi possível criar a conta agora. Tente de novo em instantes.';
  } finally { btn.disabled = false; btn.textContent = label; }
});
function startSession(u){
  me = u; lsSet('dd_session', u);
  $('#login').hidden = true; $('#main').hidden = false;
  $('#whoName').textContent = u.name; $('#avatar').textContent = initials(u.name); $('#avatar').title = u.name;
  startData();
}
$('#btnLogout').onclick = () => { lsSet('dd_session', null); me = null; $('#main').hidden = true; $('#login').hidden = false; $('#lPass').value = ''; $('#lPass2').value = ''; setTab(false); };

/* ===================== Base compartilhada ===================== */
let unwatch = null, loadedVersion = null, metaTimer = null;
function startData(){
  if (unwatch) return;
  metaTimer = setTimeout(() => { if (!META && !ROWS.length) $('#loading').textContent = 'A base compartilhada ainda não respondeu. Verifique sua conexão; a página atualiza sozinha quando ela responder.'; }, 10000);
  unwatch = S.watchMeta(async (meta, md) => {
    if (md && md.fromCache === false) clearTimeout(metaTimer);
    META = meta; renderStamp();
    if (!meta) { if (!md || !md.fromCache) showState('empty'); return; }
    if (meta.version === loadedVersion) return;
    try {
      const arr = await S.loadRows(meta);
      loadedVersion = meta.version;
      const cols = meta.cols || ALL_COLS;
      const rows = arr.map(a => { const o = {}; ALL_COLS.forEach(c => { const i = cols.indexOf(c); o[c] = i < 0 ? (NUM_COLS.has(c) ? 0 : '') : a[i]; }); return enrich(o); });
      const first = !ROWS.length;
      setData(rows, !first);
      if (!first && meta.updatedBy !== (me && me.name)) toast(`Base atualizada por ${meta.updatedBy}`);
    } catch (ex) { console.error(ex); toast(ex.message || 'Não foi possível carregar a base.'); }
  }, e => { clearTimeout(metaTimer); console.error(e); $('#loading').textContent = 'Não foi possível acessar a base compartilhada neste acesso.'; });
}
function renderStamp(){
  const b = $('#upd');
  if (!META) { b.classList.add('none'); $('#updTxt').textContent = 'Nenhuma base importada'; return; }
  b.classList.remove('none');
  $('#updTxt').innerHTML = `Atualizado em <b>${esc(fmtStamp(META.updatedAt))}</b> por <b>${esc(META.updatedBy)}</b>`;
}
function showState(s){ $('#loading').hidden = s !== 'loading'; $('#empty').hidden = s !== 'empty'; $('#app').hidden = s !== 'app'; }
/* Local de Tratativa: valor salvo por processo; sem valor salvo, vem do Setor */
let TRATS = {};          // processo -> {v, by, at}
const PENDING = {};      // processo -> valor ainda não salvo
const tratKey = v => norm(v).replace(/[^a-z]/g,'');
const TRAT_BY_KEY = Object.fromEntries(TRAT_OPTS.map(o => [tratKey(o), o]));
function tratFor(o){ const p = String(o['Processo']);
  if (PENDING[p]) return PENDING[p];
  if (TRATS[p] && TRATS[p].v) return TRATS[p].v;
  return TRAT_BY_KEY[tratKey(o['Setor'])] || 'Retorno'; }
function enrich(o){ o[TRAT] = tratFor(o); o._dl = dateKey(o['DT Lançamento']); o._s = norm(REPORT_COLS.map(c => o[c]).join(' | ')); return o; }

$('#upd').onclick = () => {
  if (!META) return;
  const h = META.history || [];
  modal(`<h3>Histórico de atualizações</h3>
    <p>Arquivo atual: <b>${esc(META.fileName)}</b> · ${fmtInt(META.rows)} linhas · ${fmtInt(META.procs || 0)} processos</p>
    <ul class="hist">${h.map(x => `<li><span><b>${esc(x.by)}</b><br><span class="muted">${esc(x.file)}</span></span><span class="muted" style="text-align:right">${esc(fmtStamp(x.at))}<br>${fmtInt(x.rows)} linhas</span></li>`).join('')}</ul>`,
    [{label:'Fechar'}]);
};

/* ===================== Importação ===================== */
function readFile(file){
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try { parseWorkbook(XLSX.read(new Uint8Array(e.target.result), {type:'array', cellDates:true}), file.name); }
    catch (err) { console.error(err); toast('Não foi possível ler o arquivo. Confira se é uma planilha Excel válida.'); }
  };
  reader.readAsArrayBuffer(file);
}
function parseWorkbook(wb, name){
  for (const sn of wb.SheetNames) {
    const aoa = XLSX.utils.sheet_to_json(wb.Sheets[sn], {header:1, defval:'', raw:true, blankrows:false});
    const hi = aoa.slice(0,20).findIndex(r => r.some(c => norm(c) === 'processo'));
    if (hi < 0) continue;
    const header = aoa[hi].map(norm), idx = {};
    ALL_COLS.forEach(c => { idx[c] = header.indexOf(norm(c)); });
    const missing = REPORT_COLS.filter(c => idx[c] < 0);
    const arr = [];
    for (const r of aoa.slice(hi+1)) {
      if (!cell(r[idx['Processo']])) continue;
      arr.push(ALL_COLS.map(c => { const v = idx[c] >= 0 ? r[idx[c]] : ''; return NUM_COLS.has(c) ? parseNum(v) : DATE_COLS.has(c) ? fmtDate(v) : cell(v); }));
    }
    if (!arr.length) continue;
    const procs = new Set(arr.map(a => a[1])).size;
    modal(`<h3>Atualizar a base para todos?</h3>
      <p><b>${esc(name)}</b> · aba "${esc(sn)}"</p>
      <p>${fmtInt(arr.length)} linhas · ${fmtInt(procs)} processos únicos</p>
      ${missing.length ? `<p style="color:var(--warn)">Colunas não encontradas: ${esc(missing.join(', '))}</p>` : ''}
      <p>A base atual será substituída e todos os usuários passarão a ver estes dados.</p>`,

async function upload(arr, name, sheet, procs){

  const meta = {version: Date.now().toString(36) + Math.random().toString(36).slice(2,6), updatedAt: new Date().toISOString(),
    updatedBy: me.name, updatedByKey: me.key, fileName: name, sheet, rows: arr.length, procs, cols: ALL_COLS};
  toast('Enviando base…', 60000);
  try {
    await S.saveBase(meta, arr, (i, n) => toast(`Enviando base… ${i}/${n}`, 60000));
    toast(S.mode === 'local' ? `Base atualizada: ${fmtInt(arr.length)} linhas, ${fmtInt(procs)} processos.` : 'Base salva. Atualizando a página para todos…', 6000);
  } catch (ex) {
    console.error(ex);
    const c = ex && ex.code;
    toast(c && READONLY.has(c) ? 'Só quem tem permissão de edição neste dashboard (e está logado no claude.ai) pode atualizar a base.'
      : c === 'conflict' ? 'Outra pessoa atualizou a base ao mesmo tempo. A página vai recarregar com a versão mais nova.'

}

const footVals = rows => REPORT_COLS.map((c,i) => i === 0 ? 'Totais' : c === 'Processo' ? `${fmtInt(uniqProc(rows))} proc.`
  : MONEY_COLS.has(c) && c !== 'Valor Unitario' ? fmtMoney(sum(rows,c)) : c === 'Qtd' ? fmtNum(sum(rows,c)) : '');
function renderTable(){
  const rows = sortedRows(), ps = +$('#pageSize').value, pages = ps ? Math.max(1, Math.ceil(rows.length/ps)) : 1;
  page = Math.min(page, pages-1);
  const slice = ps ? rows.slice(page*ps, page*ps+ps) : rows;
  const head = REPORT_COLS.map(c => `<th data-col="${esc(c)}" class="${NUM_COLS.has(c) ? 'num' : ''}">${esc(c)}<span class="s">${sort.col === c ? (sort.dir > 0 ? '▲' : '▼') : '↕'}</span></th>`).join('');
  $('#rep').innerHTML = `<thead><tr>${head}</tr></thead><tbody>${
    slice.map(r => `<tr>${REPORT_COLS.map(c => cellHtml(c, r[c], r)).join('')}</tr>`).join('') ||
    `<tr><td colspan="${REPORT_COLS.length}" class="muted" style="padding:20px;text-align:center">Nenhum registro para os filtros selecionados</td></tr>`
  }</tbody><tfoot><tr>${footVals(rows).map((v,i) => `<td class="${NUM_COLS.has(REPORT_COLS[i]) ? 'num' : ''}">${esc(v)}</td>`).join('')}</tr></tfoot>`;
  $('#repInfo').textContent = `${fmtInt(rows.length)} linhas · ${fmtInt(uniqProc(rows))} processos`;
  $('#pageInfo').textContent = ps ? `Página ${page+1} de ${pages}` : `${fmtInt(rows.length)} linhas`;
  $('#prev').disabled = page <= 0; $('#next').disabled = page >= pages-1;
}
$('#rep').addEventListener('click', e => { const th = e.target.closest('th[data-col]'); if (!th) return;
  const c = th.dataset.col; sort = {col:c, dir: sort.col === c ? -sort.dir : 1}; renderTable(); });
$('#pageSize').onchange = () => { page = 0; renderTable(); };
$('#prev').onclick = () => { page--; renderTable(); };
$('#next').onclick = () => { page++; renderTable(); };

/* ===================== Exportar ===================== */
function filterSummary(){
  const parts = [];
  for (const c in filters) if (filters[c] && filters[c].size) parts.push(`${c}: ${[...filters[c]].map(v => display(c, v)).join(', ')}`);
  if (dateFrom || dateTo) parts.push(`Lançamento: ${dateFrom.split('-').reverse().join('/') || '…'} a ${dateTo.split('-').reverse().join('/') || '…'}`);
  if (query) parts.push(`Pesquisa: "${$('#q').value}"`);
  return parts.length ? parts.join(' | ') : 'Sem filtros';
}
const stampName = ext => { const d = new Date(); return `Relatorio_Debitos_${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}_${pad(d.getHours())}${pad(d.getMinutes())}.${ext}`; };
async function offer(filename, blob, fallback){
  if (dl) {
    try { await dl.save({filename, data: blob}); toast('Arquivo salvo.'); }
    catch (e) { if (e && e.code === 'declined') return; if (e && e.code === 'rate_limited') { toast('Já há um download aguardando confirmação.'); return; } toast('Não foi possível salvar o arquivo neste acesso.'); }
    return;
  }
  fallback();
}
$('#btnExcel').onclick = () => {
  const rows = sortedRows(); if (!rows.length) { toast('Nada para exportar.'); return; }
  const aoa = [REPORT_COLS, ...rows.map(r => REPORT_COLS.map(c => r[c]))];
  const ws = XLSX.utils.aoa_to_sheet(aoa);
  ws['!cols'] = REPORT_COLS.map(c => ({wch: c === 'Descrição' ? 46 : c === 'Transportador' ? 36 : Math.max(10, c.length + 2)}));
  ws['!autofilter'] = {ref: XLSX.utils.encode_range({s:{r:0,c:0}, e:{r:aoa.length-1, c:REPORT_COLS.length-1}})};
  for (let R = 1; R < aoa.length; R++) REPORT_COLS.forEach((c, C) => { const ref = XLSX.utils.encode_cell({r:R, c:C}); if (ws[ref] && MONEY_COLS.has(c)) ws[ref].z = '"R$" #,##0.00'; });
  const info = XLSX.utils.aoa_to_sheet([['Relatório de Débitos'],['Gerado em', new Date().toLocaleString('pt-BR')],['Gerado por', me ? me.name : ''],
    ['Base', META ? `${META.fileName} · atualizada em ${fmtStamp(META.updatedAt)} por ${META.updatedBy}` : ''],['Filtros', filterSummary()],
    ['Linhas', rows.length],['Processos únicos', uniqProc(rows)],['Valor Total', sum(rows,'Valor Total')],['Valor Desconto', sum(rows,'Valor Desconto')],['Valor Frete', sum(rows,'Valor Frete')]]);
  info['!cols'] = [{wch:18},{wch:100}];
  const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, 'Relatório'); XLSX.utils.book_append_sheet(wb, info, 'Resumo');
  const name = stampName('xlsx');
  const blob = new Blob([XLSX.write(wb, {bookType:'xlsx', type:'array'})], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
  offer(name, blob, () => XLSX.writeFile(wb, name));
};
$('#btnPrint').onclick = () => {
  const rows = sortedRows(); if (!rows.length) { toast('Nada para imprimir.'); return; }
  const J = window.jspdf && window.jspdf.jsPDF;
  if (!J) { toast('Gerador de PDF indisponível. Verifique a conexão.'); return; }
  const doc = new J({orientation:'landscape', unit:'mm', format:'a4'});
  doc.setFontSize(13); doc.setFont(undefined, 'bold'); doc.text('Relatório de Débitos', 8, 11);
  doc.setFontSize(7.5); doc.setFont(undefined, 'normal');
  const lines = doc.splitTextToSize(`${META ? `Base: ${META.fileName} · atualizada em ${fmtStamp(META.updatedAt)} por ${META.updatedBy}` : ''} · Gerado em ${new Date().toLocaleString('pt-BR')}${me ? ' por ' + me.name : ''} · ${fmtInt(rows.length)} linhas · ${fmtInt(uniqProc(rows))} processos únicos · Valor Total ${fmtMoney(sum(rows,'Valor Total'))}\nFiltros: ${filterSummary()}`, 280);
  doc.text(lines, 8, 16);
  const numIdx = {}; REPORT_COLS.forEach((c,i) => { if (NUM_COLS.has(c)) numIdx[i] = {halign:'right'}; });
  doc.autoTable({
    startY: 16 + lines.length * 3.2 + 2, margin:{left:6, right:6}, theme:'grid',
    head:[REPORT_COLS], foot:[footVals(rows)], showFoot:'lastPage',
    body: rows.map(r => REPORT_COLS.map(c => MONEY_COLS.has(c) ? fmtMoney(r[c]) : NUM_COLS.has(c) ? fmtNum(r[c]) : String(r[c] ?? ''))),
    styles:{fontSize:5.2, cellPadding:0.8, overflow:'linebreak', lineColor:[200,205,212], lineWidth:0.1},
    headStyles:{fillColor:[31,95,209], textColor:255, fontSize:5.2}, footStyles:{fillColor:[235,238,243], textColor:20},
    columnStyles:{...numIdx, [REPORT_COLS.indexOf('Descrição')]:{cellWidth:28}},
    didDrawPage: d => { doc.setFontSize(6.5); doc.text(`Página ${d.pageNumber}`, 290, 205, {align:'right'}); }
  });
  const name = stampName('pdf');
  offer(name, doc.output('blob'), () => doc.save(name));
};

/* ===================== Eventos gerais ===================== */
let qt;
$('#q').addEventListener('input', e => { clearTimeout(qt); qt = setTimeout(() => { query = norm(e.target.value); page = 0; if (ROWS.length) refresh(); }, 180); });
$('#btnImport').onclick = () => $('#file').click();
$('#file').onchange = e => { readFile(e.target.files[0]); e.target.value = ''; };
$('#btnClear').onclick = () => { for (const k in filters) delete filters[k]; dateFrom = dateTo = ''; query = ''; $('#q').value = ''; page = 0; refresh(); };
$('#btnToggleFilters').onclick = e => { const f = $('#filters'); f.classList.toggle('collapsed'); e.target.textContent = f.classList.contains('collapsed') ? 'Expandir' : 'Recolher'; lsSet('dd_fcollapsed', f.classList.contains('collapsed')); };
if (lsGet('dd_fcollapsed')) { $('#filters').classList.add('collapsed'); $('#btnToggleFilters').textContent = 'Expandir'; }
const THEMES = [
  {id:'auto', name:'Automático', sw:['#eef1f5','#18202a','#1f5fd1']},
  {id:'claro', name:'Claro', theme:'light', sw:['#eef1f5','#ffffff','#1f5fd1']},
  {id:'escuro', name:'Escuro', theme:'dark', sw:['#0f141b','#18202a','#6d9cff']},
  {id:'areia', name:'Areia', theme:'light', sw:['#f4eee2','#fffdf8','#a94e1c']},
  {id:'lavanda', name:'Lavanda', theme:'light', sw:['#f1eff9','#ffffff','#6447d6']},
  {id:'menta', name:'Menta', theme:'light', sw:['#ecf6f3','#ffffff','#0b7a6c']},
  {id:'oceano', name:'Oceano', theme:'dark', sw:['#0b1a2b','#11253b','#46c6d8']},
  {id:'floresta', name:'Floresta', theme:'dark', sw:['#0d1a14','#13241c','#63d394']},
  {id:'vinho', name:'Vinho', theme:'dark', sw:['#1c0f14','#2a161d','#ff94ab']},
  {id:'grafite', name:'Grafite', theme:'dark', sw:['#141414','#1f1f1f','#ff9d42']}
];
function applyTheme(id){
  const t = THEMES.find(x => x.id === id) || THEMES[0], root = document.documentElement;
  if (t.theme) root.dataset.theme = t.theme; else delete root.dataset.theme;
  if (t.theme && !['claro','escuro'].includes(t.id)) root.dataset.palette = t.id; else delete root.dataset.palette;
  lsSet('dd_palette', t.id);
  if (ROWS.length) renderCharts();
}
function renderThemeMenu(){
  const cur = lsGet('dd_palette') || 'auto';
  $('#tmenu').innerHTML = '<div class="tl">Tema de cores</div>' + THEMES.map(t => `<button role="menuitemradio" aria-checked="${t.id === cur}" data-id="${t.id}"><span class="sw">${t.sw.map(c => `<i style="background:${c}"></i>`).join('')}</span>${esc(t.name)}</button>`).join('');
}
$('#btnTheme').onclick = e => {
  e.stopPropagation(); const m = $('#tmenu');
  if (!m.hidden) { m.hidden = true; return; }
  renderThemeMenu(); m.hidden = false;
  const r = $('#btnTheme').getBoundingClientRect();
  m.style.top = (r.bottom + 6) + 'px'; m.style.left = Math.max(8, Math.min(r.right - m.offsetWidth, innerWidth - m.offsetWidth - 8)) + 'px';
};
$('#tmenu').addEventListener('click', e => { const b = e.target.closest('button[data-id]'); if (!b) return; applyTheme(b.dataset.id); renderThemeMenu(); });
document.addEventListener('click', e => { if (!$('#tmenu').contains(e.target) && e.target !== $('#btnTheme')) $('#tmenu').hidden = true; });
{ const t = lsGet('dd_palette'); if (t) applyTheme(t); else { const o = lsGet('dd_theme'); if (o) applyTheme(o === 'dark' ? 'escuro' : 'claro'); } }
document.addEventListener('dragover', e => { e.preventDefault(); if (me) $('#empty').classList.add('over'); });
document.addEventListener('dragleave', e => { if (!e.relatedTarget) $('#empty').classList.remove('over'); });
document.addEventListener('drop', e => { e.preventDefault(); $('#empty').classList.remove('over'); const f = e.dataTransfer.files[0]; if (f && me) readFile(f); });
$('#empty').onclick = () => $('#file').click(); $('#empty').style.cursor = 'pointer';

/* ===================== Inicialização ===================== */
async function boot(){
  let art = null;
  const inHost = !!(window.claude && typeof window.claude.use === 'function');
  if (inHost) { try { [art, dl] = await Promise.all([window.claude.use('artifact'), window.claude.use('downloads')]); } catch(_) { art = null; dl = null; } }
  S = inHost ? pageStore(art) : localStore();
  $('#lMode').textContent = S.mode === 'local' ? 'Modo local: contas e base ficam salvas apenas neste navegador.' : '';
  $('#lSubmit').disabled = false;
  const sess = lsGet('dd_session');
  if (sess && sess.key) {
    try { const acc = await S.getAccount(sess.key); if (acc) { startSession({key: sess.key, name: acc.name}); return; } } catch(_){}
  }
  $('#login').hidden = false;
}
$('#login').hidden = false;
$('#lSubmit').disabled = true;
$('#lMode').textContent = 'Carregando…';
boot();
})();
</script>
